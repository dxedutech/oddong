<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<title>ODDONG iframe</title>
	<meta http-equiv="Content-Security-Policy" content="">
	<meta name="description" content="ODDONG">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		html,
		body { margin: 0; padding: 0; }
		.iframe-container { width: 100%; height: 100vh; /* 화면 전체 */ overflow: hidden; }
		iframe { width: 100%; height: 100%; border: none; }
	</style>
</head>

<body>
	<div class="iframe-container">
		<!-- src="http://127.0.0.1:5500/?page=book&home=oddong" -->
		<iframe style="width: 100%; height: 100%; aspect-ratio: 1/1; border: none;"
			src="http://127.0.0.1:5500/?page=engtracing"
			allowtransparency="true" 
			frameborder="0"
			scrolling="no"
			allowfullscreen>
		</iframe>
	</div>
</body>

</html>
